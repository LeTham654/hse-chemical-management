{% extends "base.html" %}

{% block content %}
<div class="khung-login">
    <h2 style="text-align: center; margin-bottom: 25px; color: #111827;">Đăng Nhập Hệ Thống</h2>
    
    <!-- Hiển thị thông báo lỗi nếu nhập sai -->
    {% if error %}
        <p style="color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-weight: 600; font-size: 14px;">
            {{ error }}
        </p>
    {% endif %}

    <form action="/login" method="POST" class="form-login">
        <label for="username">Tài khoản</label>
        <input type="text" id="username" name="username" placeholder="Nhập tên tài khoản..." required>

        <label for="password" style="margin-top: 15px;">Mật khẩu</label>
        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu..." required>

        <button type="submit" style="margin-top: 25px;">Đăng nhập</button>
    </form>
</div>
{% endblock %}
